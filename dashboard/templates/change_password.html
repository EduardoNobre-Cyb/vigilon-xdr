<!DOCTYPE html>
<html>
  <head>
    <title>Vigilon - Change Password</title>
    <link rel="icon" href="{{ url_for('static', filename='images/vigilon-owl.svg') }}" type="image/svg+xml">
    <link rel="alternate icon" href="{{ url_for('static', filename='images/vigilon-icon-192.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/vigilon-icon-192.png') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" type="text/css"/>
    <script src="{{ url_for('static', filename='js/change-password-guard.js') }}"></script>
  </head>
  <body>

    <div class="login-wrapper">

      <div class="login-hero">
        <div class="login-hero-logo">
          <img src="{{ url_for('static', filename='images/vigilon-owl.svg') }}" alt="Vigilon">
        </div>
        <div class="login-hero-title">VIGILON</div>
        <div class="login-hero-tagline">
          Multi-Agent XDR Platform for Unified Log<br>and Endpoint Threat Defense
        </div>
        <div class="login-hero-divider"></div>
        <div class="login-hero-version">
          v2.0.0 <span class="online-dot"></span> SYSTEM ONLINE
        </div>
      </div>

      <div class="login-form-side">
        <div class="login-card">
          <h2 style="font-family:var(--font-display);font-size:24px;font-weight:700;margin-bottom:4px;">Change Password</h2>
          <p style="color:var(--fg-muted);font-size:13px;margin-bottom:28px;" id="page-subtitle">Set a new permanent password to continue.</p>

          <form class="login-form" id="change-form" onsubmit="handleChange(event)" novalidate>

            <div class="login-field">
              <label class="login-label" for="current-password">Current Password</label>
              <div class="password-wrapper">
                <input class="login-input" type="password" id="current-password" placeholder="Enter current password" autocomplete="current-password" required/>
                <button type="button" class="eye-toggle" onclick="togglePassword('current-password', this)" title="Show/hide"><span data-icon="eye"></span></button>
              </div>
            </div>

            <div class="login-field">
              <label class="login-label" for="new-password">New Password</label>
              <div class="password-wrapper">
                <input class="login-input" type="password" id="new-password" placeholder="Minimum 8 characters" autocomplete="new-password" required/>
                <button type="button" class="eye-toggle" onclick="togglePassword('new-password', this)" title="Show/hide"><span data-icon="eye"></span></button>
              </div>
            </div>

            <div class="login-field">
              <label class="login-label" for="confirm-password">Confirm New Password</label>
              <div class="password-wrapper">
                <input class="login-input" type="password" id="confirm-password" placeholder="Repeat new password" autocomplete="new-password" required/>
                <button type="button" class="eye-toggle" onclick="togglePassword('confirm-password', this)" title="Show/hide"><span data-icon="eye"></span></button>
              </div>
            </div>

            <div class="login-error" id="change-error" style="display:none;"></div>

            <button class="login-btn" type="submit" id="change-btn">
              <span id="btn-text">Update Password</span>
            </button>

          </form>

          <div class="login-footer">
            <span>v2.0.0</span>
            <span class="login-status"><span class="online-dot"></span> SECURE</span>
          </div>
        </div>
      </div>

    </div>

    <script src="{{ url_for('static', filename='js/icons.js') }}"></script>
    <script src="{{ url_for('static', filename='js/change-password.js') }}"></script>

  </body>
</html>
